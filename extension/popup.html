<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{
    --ink:#0e1116; --ink-2:#3c4450; --muted:#6b7482; --line:#e3e6ea; --line-2:#d3d8de;
    --phish-fg:#a02d1c; --phish-bg:#fdeae5; --phish-line:#f2c4b8;
    --legit-fg:#0f6b45; --legit-bg:#e4f4ec; --legit-line:#bde0cd;
    --unsure-fg:#8a5a10; --unsure-bg:#fdf2df; --unsure-line:#eedcb6;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; width:340px; font-family:"Inter", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    color:var(--ink); background:#fff;
  }
  header{
    display:flex; align-items:center; gap:.5rem; padding:.85rem 1rem;
    border-bottom:1px solid var(--line);
  }
  header b{ font-size:.95rem; font-weight:650; letter-spacing:-.01em; }
  main{ padding:1rem; }

  form{ display:flex; gap:.4rem; }
  input[type=text]{
    flex:1; padding:.5rem .65rem; border-radius:8px; border:1px solid var(--line-2);
    font-size:.82rem; font-family:ui-monospace, Menlo, monospace; outline:none; min-width:0;
  }
  input[type=text]:focus{ border-color:#aab2bd; }
  button{
    border:none; border-radius:8px; padding:.5rem .85rem; font-size:.82rem;
    font-weight:600; cursor:pointer; background:var(--ink); color:#fff;
  }
  button:hover{ opacity:.88; }
  button:disabled{ opacity:.5; cursor:default; }
  .row{ display:flex; gap:.5rem; margin-top:.55rem; }
  .row button.secondary{ background:#fff; color:var(--ink-2); border:1px solid var(--line-2); flex:1; }

  #result{ margin-top:1rem; }
  .verdict-row{ display:flex; align-items:center; gap:.5rem; }
  .verdict{
    display:inline-flex; align-items:center; gap:.4rem; padding:.32rem .7rem;
    border-radius:999px; font-weight:700; font-size:.76rem; border:1px solid transparent;
  }
  .verdict.phishing{ background:var(--phish-bg); color:var(--phish-fg); border-color:var(--phish-line); }
  .verdict.legitimate{ background:var(--legit-bg); color:var(--legit-fg); border-color:var(--legit-line); }
  .verdict.uncertain{ background:var(--unsure-bg); color:var(--unsure-fg); border-color:var(--unsure-line); }
  .conf{ margin-left:auto; font-size:.8rem; font-weight:650; color:var(--muted); }
  .checked-url{
    font-family:ui-monospace, Menlo, monospace; font-size:.72rem; color:var(--muted);
    word-break:break-all; margin-top:.5rem; line-height:1.5;
  }
  .sect{
    font-size:.65rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    font-weight:600; margin:.75rem 0 .35rem;
  }
  ul{ margin:0; padding-left:1rem; font-size:.78rem; color:var(--ink-2); line-height:1.55; }
  li{ margin-bottom:.25rem; }
  .abstain{
    margin-top:.7rem; padding:.6rem .7rem; border-radius:8px; background:var(--unsure-bg);
    border:1px solid var(--unsure-line); color:#6f4a10; font-size:.76rem; line-height:1.55;
  }
  .error{ color:var(--phish-fg); font-size:.78rem; }
  .muted{ color:var(--muted); font-size:.78rem; }
  .stale{
    display:inline-block; margin-top:.6rem; padding:.25rem .55rem; border-radius:6px;
    background:#f4f5f7; color:var(--muted); font-size:.68rem;
  }
  footer{
    padding:.6rem 1rem; border-top:1px solid var(--line); font-size:.68rem; color:var(--muted);
  }
</style>
</head>
<body>
  <header>
    <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
      <circle cx="14" cy="14" r="9.25" stroke="#0e1116" stroke-width="2.4"/>
      <path d="M20.9 20.9 L27.5 27.5" stroke="#0e1116" stroke-width="2.9" stroke-linecap="round"/>
      <path d="M10.1 14.35 L12.85 17.1 L18.0 11.1" stroke="#0e1116" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <b>PhishLens</b>
  </header>
  <main>
    <form id="form">
      <input type="text" id="url" placeholder="Paste a URL…" autocomplete="off" spellcheck="false" />
      <button type="submit" id="checkBtn">Check</button>
    </form>
    <div class="row">
      <button type="button" class="secondary" id="checkTabBtn">Check current page</button>
    </div>
    <div id="result"></div>
  </main>
  <footer>Right-click any link on a page → “Check this link with PhishLens”</footer>
  <script src="popup.js"></script>
</body>
</html>
